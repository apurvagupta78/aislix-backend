[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Materialize LFS before Docker build (Dockerfile also pulls LFS if .git is present).
buildCommand = "git lfs install && git lfs pull"

[deploy]
startCommand = "python run.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[deploy.env]
OCR_ENGINE = "paddle"
EMBED_BATCH_SIZE = "16"
USE_RETAILKLIP = "true"
